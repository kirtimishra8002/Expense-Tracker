<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Dashboard - Preview</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- LEFT: Today's Log & Add Form -->
        <div class="left-pane">
            <div class="card today-card">
                <h2>Today's Expense</h2>
                <div class="amount-display" id="todayTotalDisplay">₹0.00</div>
            </div>

            <div class="card log-card">
                <h3>Today's Log</h3>
                <ul class="expense-list" id="todayLogList"></ul>

                <form class="add-form" onsubmit="addExpense(event)">
                    <h4>Add Expense</h4>
                    <input type="text" id="addTitle" placeholder="Description" required>
                    <input type="number" step="0.01" id="addAmount" placeholder="Amount (₹)" required>
                    <select id="addCategory">
                        <option value="General">General</option>
                        <option value="Food">Food & Dining</option>
                        <option value="Groceries">Groceries</option>
                        <option value="Transport">Transport</option>
                        <option value="Utilities">Utilities & Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                    </select>
                    <input type="date" id="addDate">
                    <button type="submit">Add Expense</button>
                </form>
            </div>
        </div>

        <!-- RIGHT: Monthly Calendar & Date Summary -->
        <div class="right-pane">
            <div class="card calendar-card">
                <h2>Monthly Calendar</h2>
                <div class="calendar-widget">
                    <div class="calendar-header">
                        <div class="calendar-title" id="calMonthYear"></div>
                        <div class="calendar-nav">
                            <button class="cal-nav-btn" onclick="changeMonth(-1)">&lt;</button>
                            <button class="cal-nav-btn" onclick="jumpToday()">Today</button>
                            <button class="cal-nav-btn" onclick="changeMonth(1)">&gt;</button>
                        </div>
                    </div>
                    <div class="cal-weekdays">
                        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                    </div>
                    <div class="cal-days-grid" id="calDaysGrid"></div>
                </div>

                <div class="date-summary">
                    <h3 id="dateSummaryTitle">Summary for Today</h3>
                    <p class="selected-total" id="dateSummaryTotal">Total: ₹0.00</p>
                    <ul class="expense-list" id="selectedExpensesList"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Dialog Modal -->
    <dialog id="editModal">
        <div class="modal-header">
            <h3>Modify Expense</h3>
            <button class="action-btn" onclick="document.getElementById('editModal').close()">&times;</button>
        </div>
        <form class="edit-form" onsubmit="saveEdit(event)">
            <input type="hidden" id="editId">
            <label>Description</label>
            <input type="text" id="editTitle" required>
            <label>Amount (₹)</label>
            <input type="number" step="0.01" id="editAmount" required>
            <label>Category</label>
            <select id="editCat">
                <option value="General">General</option>
                <option value="Food">Food & Dining</option>
                <option value="Groceries">Groceries</option>
                <option value="Transport">Transport</option>
                <option value="Utilities">Utilities & Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
            </select>
            <label>Date</label>
            <input type="date" id="editDate" required>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="document.getElementById('editModal').close()">Cancel</button>
                <button type="submit">Save Changes</button>
            </div>
        </form>
    </dialog>

    <script>
        const KEY = "expense_tracker_items";
        const getLocalDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        let expenses = JSON.parse(localStorage.getItem(KEY) || "[]");
        const todayStr = getLocalDate();
        document.getElementById("addDate").value = todayStr;

        let curY = new Date().getFullYear(), curM = new Date().getMonth(), selDate = todayStr;

        function saveAndRender() {
            localStorage.setItem(KEY, JSON.stringify(expenses));
            renderCalendar();
            renderLists();
        }

        function renderLists() {
            // Today list
            const todays = expenses.filter(e => e.date === todayStr);
            const todayList = document.getElementById("todayLogList");
            todayList.innerHTML = todays.length ? "" : '<p class="empty-text">No expenses recorded for today.</p>';
            let todayTotal = 0;
            todays.forEach(item => {
                todayTotal += item.amount;
                todayList.innerHTML += createItemHtml(item);
            });
            document.getElementById("todayTotalDisplay").textContent = `₹${todayTotal.toFixed(2)}`;

            // Selected Date list
            document.getElementById("dateSummaryTitle").textContent = `Summary for ${selDate}`;
            const selected = expenses.filter(e => e.date === selDate);
            const selList = document.getElementById("selectedExpensesList");
            selList.innerHTML = selected.length ? "" : '<p class="empty-text">No expenses on this date.</p>';
            let selTotal = 0;
            selected.forEach(item => {
                selTotal += item.amount;
                selList.innerHTML += createItemHtml(item);
            });
            document.getElementById("dateSummaryTotal").textContent = `Total: ₹${selTotal.toFixed(2)}`;
        }

        function createItemHtml(item) {
            return `
                <li class="expense-item">
                    <div class="expense-info"><span class="expense-title">${item.title}</span><span class="expense-meta">${item.category} • ${item.date}</span></div>
                    <div class="expense-right">
                        <span class="expense-amount">₹${item.amount.toFixed(2)}</span>
                        <button class="action-btn" onclick="openEdit(${item.id})">Edit</button>
                        <button class="action-btn delete-btn" onclick="deleteItem(${item.id})">&times;</button>
                    </div>
                </li>`;
        }

        function renderCalendar() {
            document.getElementById("calMonthYear").textContent = `${new Date(curY, curM).toLocaleString('default', { month: 'long' })} ${curY}`;
            const grid = document.getElementById("calDaysGrid");
            grid.innerHTML = "";
            const firstDay = new Date(curY, curM, 1).getDay(), totalDays = new Date(curY, curM + 1, 0).getDate(), prevTotal = new Date(curY, curM, 0).getDate();
            const expDates = new Set(expenses.map(e => e.date));

            for (let i = firstDay - 1; i >= 0; i--) grid.innerHTML += `<div class="cal-day-cell other-month">${prevTotal - i}</div>`;
            for (let d = 1; d <= totalDays; d++) {
                const dStr = `${curY}-${String(curM + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                grid.innerHTML += `<div class="cal-day-cell ${dStr === todayStr ? 'today' : ''} ${dStr === selDate ? 'selected' : ''}" onclick="selectDate('${dStr}')">${d}${expDates.has(dStr) ? '<div class="expense-dot"></div>' : ''}</div>`;
            }
            const trailing = (7 - ((firstDay + totalDays) % 7)) % 7;
            for (let j = 1; j <= trailing; j++) grid.innerHTML += `<div class="cal-day-cell other-month">${j}</div>`;
        }

        function selectDate(dStr) {
            selDate = dStr;
            renderCalendar();
            renderLists();
        }

        function changeMonth(delta) {
            curM += delta;
            if (curM < 0) { curM = 11; curY--; } else if (curM > 11) { curM = 0; curY++; }
            renderCalendar();
        }

        function jumpToday() {
            const now = new Date();
            curY = now.getFullYear(); curM = now.getMonth();
            selectDate(getLocalDate(now));
        }

        function addExpense(e) {
            e.preventDefault();
            const title = document.getElementById("addTitle").value.trim();
            const amount = parseFloat(document.getElementById("addAmount").value);
            const category = document.getElementById("addCategory").value;
            const date = document.getElementById("addDate").value || todayStr;
            if (!title || isNaN(amount) || amount <= 0) return;

            expenses.unshift({ id: Date.now(), title, amount, category, date });
            saveAndRender();
            e.target.reset();
            document.getElementById("addDate").value = todayStr;
        }

        function openEdit(id) {
            const item = expenses.find(e => e.id === id);
            if (!item) return;
            document.getElementById("editId").value = item.id;
            document.getElementById("editTitle").value = item.title;
            document.getElementById("editAmount").value = item.amount;
            document.getElementById("editCat").value = item.category || "General";
            document.getElementById("editDate").value = item.date;
            document.getElementById("editModal").showModal();
        }

        function saveEdit(e) {
            e.preventDefault();
            const id = Number(document.getElementById("editId").value);
            const item = expenses.find(e => e.id === id);
            if (item) {
                item.title = document.getElementById("editTitle").value.trim();
                item.amount = parseFloat(document.getElementById("editAmount").value);
                item.category = document.getElementById("editCat").value;
                item.date = document.getElementById("editDate").value;
                document.getElementById("editModal").close();
                saveAndRender();
            }
        }

        function deleteItem(id) {
            if (confirm("Delete this expense?")) {
                expenses = expenses.filter(e => e.id !== id);
                saveAndRender();
            }
        }

        saveAndRender();
    </script>
</body>
</html>
